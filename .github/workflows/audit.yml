name: Audit

# Budgets, axe and the layout probes, measured against a warmed, logged-out
# site. Kept out of the parity workflow because it measures performance: a job
# that also imports content and builds CSS would be measuring the runner's
# warm-up, not the site.
#
# The committed Lighthouse figures in audit-evidence/ are host measurements and
# are NOT reproduced here — a shared runner cannot reproduce them, and a number
# that moves with the weather is not a gate. What is gated here is what does
# hold on any machine: request counts, transfer sizes, axe violations, CLS,
# console cleanliness and HTTP status.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Budgets and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not on Dependabot's pull requests. These jobs boot Docker, import content
    # and drive a browser, and Actions minutes are metered on a private
    # repository — which this is again. A dependency bump does not warrant that;
    # Code quality and Supply chain still run on every pull request, and those
    # are where a lint or advisory regression would show. The push to main runs
    # everything.
    if: github.actor != 'dependabot[bot]'
    steps:
      # reference/static is a SUBMODULE (cartorjo/weave-clone) and it is not
      # optional here — tools/routes.mjs imports the reference build's
      # pages.mjs, so without it this job dies on ERR_MODULE_NOT_FOUND rather
      # than on anything it was meant to check, which is how the first CI run
      # failed. actions/checkout does not fetch submodules by default. The guard
      # below turns an auth or availability failure into one sentence instead of
      # a module-resolution stack trace.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Confirm the reference build is present
        run: |
          test -f reference/static/pages.mjs || {
            echo "::error::reference/static is empty — the submodule did not check out. If cartorjo/weave-clone is private again, add a SUBMODULE_TOKEN secret with read access and pass it as checkout's token; the default GITHUB_TOKEN cannot read another private repository."
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run build:css
      - run: npm run wp:start
      # wp:bootstrap, not wp:seed. Three idempotent steps, each of which CI
      # proved is required on an empty database and none of which anything else
      # does: activate the theme (WordPress otherwise serves its own default,
      # whose inline scripts the CSP blocks), scaffold the 41 route objects
      # along with postname permalinks, the front page and blog_public=0, then
      # import the content. Seeding alone produced a site where every route
      # 404ed; seeding plus scaffolding produced one where every route failed
      # on CSP violations from the wrong theme.
      - name: Scaffold routes and seed content
        run: npm run wp:bootstrap

      # Two passes. The first warms every route; the second is the one that
      # gates, because the budgets describe a warm site.
      - name: Warm
        run: npm run audit || true

      - name: Audit
        run: npm run audit

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-report
          path: audit-evidence/wp/latest.json
          if-no-files-found: warn
