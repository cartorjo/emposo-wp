name: Parity

# The primary gate. Brings up WordPress, seeds it from the frozen export, and
# asserts that all 41 routes still render what the audited static build renders.
# Slow by nature — it boots Docker, imports content and drives a browser — so it
# is a separate workflow from the fast checks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: DOM parity, class inventory, behaviours
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not on Dependabot's pull requests. These jobs boot Docker, import content
    # and drive a browser; running them per dependency bump spends far more
    # than the bump is worth, and they cannot pass there anyway — Dependabot's
    # token cannot read the private submodule. The push to main still runs them.
    if: github.actor != 'dependabot[bot]'
    steps:
      # reference/static is a SUBMODULE (private: cartorjo/weave-clone), and it
      # is not optional here — tools/routes.mjs imports the reference build's
      # pages.mjs, so without it this job dies on ERR_MODULE_NOT_FOUND rather
      # than on anything it was meant to check. actions/checkout does not fetch
      # submodules by default, and the default GITHUB_TOKEN cannot read another
      # private repository, so a token with access must be provided as the
      # SUBMODULE_TOKEN secret.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Confirm the reference build is present
        run: |
          test -f reference/static/pages.mjs || {
            echo "::error::reference/static is empty. Add a SUBMODULE_TOKEN secret with read access to cartorjo/weave-clone (a fine-grained PAT or a deploy key); the default GITHUB_TOKEN cannot read a private submodule."
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build CSS
        run: npm run build:css

      - name: Start WordPress
        run: npm run wp:start

      # The importer MUST run before parity. It is idempotent, so a re-run is
      # safe, but skipping it leaves an empty site that every route check would
      # fail against for the wrong reason.
      - name: Seed content
        run: npm run wp:seed

      - name: Verify the route and content contract
        run: npm run wp -- emposo verify --routes --content --media --invariants

      - name: Class inventory
        run: npm run class-inventory

      # Warm the cache first: the first request to each route pays for rewrite
      # resolution and a cold object cache, and parity compares rendered DOM,
      # not timings — but a cold run is where flaky failures come from.
      - name: Warm
        run: npm run parity

      - name: DOM parity (strict)
        run: npm run parity -- --strict

      - name: Behaviour contracts
        run: npm run behaviours

      - name: Logs on failure
        if: failure()
        run: npm run wp:logs -- --debug || true
