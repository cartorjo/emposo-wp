name: Parity

# The primary gate. Brings up WordPress, seeds it from the frozen export, and
# asserts that all 41 routes still render what the audited static build renders.
# Slow by nature — it boots Docker, imports content and drives a browser — so it
# is a separate workflow from the fast checks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: DOM parity, class inventory, behaviours
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not on Dependabot's pull requests. These jobs boot Docker, import content
    # and drive a browser, and Actions minutes are metered on a private
    # repository — which this is again. A dependency bump does not warrant that;
    # Code quality and Supply chain still run on every pull request, and those
    # are where a lint or advisory regression would show. The push to main runs
    # everything.
    # Event-scoped: skip only Dependabot PULL REQUESTS. A bare actor check
    # would also skip pushes to main made by that actor, silently breaking
    # the "push to main runs everything" guarantee.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    steps:
      # reference/static is a SUBMODULE (cartorjo/weave-clone) and it is not
      # optional here — tools/routes.mjs imports the reference build's
      # pages.mjs, so without it this job dies on ERR_MODULE_NOT_FOUND rather
      # than on anything it was meant to check, which is how the first CI run
      # failed. actions/checkout does not fetch submodules by default. The guard
      # below turns an auth or availability failure into one sentence instead of
      # a module-resolution stack trace.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Confirm the reference build is present
        run: |
          test -f reference/static/pages.mjs || {
            echo "::error::reference/static is empty — the submodule did not check out. If cartorjo/weave-clone is private again, add a SUBMODULE_TOKEN secret with read access and pass it as checkout's token; the default GITHUB_TOKEN cannot read another private repository."
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build CSS
        run: npm run build:css

      - name: Start WordPress
        run: npm run wp:start

      # wp:bootstrap, not wp:seed. Three idempotent steps, each of which CI
      # proved is required on an empty database and none of which anything else
      # does: activate the theme (WordPress otherwise serves its own default,
      # whose inline scripts the CSP blocks), scaffold the 41 route objects
      # along with postname permalinks, the front page and blog_public=0, then
      # import the content. Seeding alone produced a site where every route
      # 404ed; seeding plus scaffolding produced one where every route failed
      # on CSP violations from the wrong theme.
      - name: Scaffold routes and seed content
        run: npm run wp:bootstrap

      - name: Verify the route and content contract
        run: npm run wp -- emposo verify --routes --content --media --invariants --security

      - name: Class inventory
        run: npm run class-inventory

      # Warm the cache first: the first request to each route pays for rewrite
      # resolution and a cold object cache, and parity compares rendered DOM,
      # not timings — but a cold run is where flaky failures come from.
      - name: Warm
        run: npm run parity

      - name: DOM parity (strict)
        run: npm run parity -- --strict

      - name: Behaviour contracts
        run: npm run behaviours

      - name: Logs on failure
        if: failure()
        # Capped: on one failure this step followed the container logs until
        # the job's 30-minute timeout, turning a red run into "cancelled".
        run: timeout 120 npm run wp:logs -- --debug || true
