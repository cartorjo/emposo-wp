name: Parity

# The primary gate. Brings up WordPress, seeds it from the frozen export, and
# asserts that all 41 routes still render what the audited static build renders.
# Slow by nature — it boots Docker, imports content and drives a browser — so it
# is a separate workflow from the fast checks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: DOM parity, class inventory, behaviours
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # reference/static is a SUBMODULE (cartorjo/weave-clone) and it is not
      # optional here — tools/routes.mjs imports the reference build's
      # pages.mjs, so without it this job dies on ERR_MODULE_NOT_FOUND rather
      # than on anything it was meant to check, which is how the first CI run
      # failed. actions/checkout does not fetch submodules by default. The guard
      # below turns an auth or availability failure into one sentence instead of
      # a module-resolution stack trace.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Confirm the reference build is present
        run: |
          test -f reference/static/pages.mjs || {
            echo "::error::reference/static is empty — the submodule did not check out. If cartorjo/weave-clone is private again, add a SUBMODULE_TOKEN secret with read access and pass it as checkout's token; the default GITHUB_TOKEN cannot read another private repository."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build CSS
        run: npm run build:css

      - name: Start WordPress
        run: npm run wp:start

      # wp:bootstrap, not wp:seed. scaffold creates the 41 route objects AND sets
      # the things the contract's paths need to exist at all — postname
      # permalinks, the front page, blog_public=0 — then flushes the rewrite
      # rules; import fills those objects with content. Seeding alone produced
      # a site where every route 404ed, which is how CI first failed here: on
      # this machine scaffold had been run in an earlier session, so the
      # difference never showed. Both commands are idempotent.
      - name: Scaffold routes and seed content
        run: npm run wp:bootstrap

      - name: Verify the route and content contract
        run: npm run wp -- emposo verify --routes --content --media --invariants

      - name: Class inventory
        run: npm run class-inventory

      # Warm the cache first: the first request to each route pays for rewrite
      # resolution and a cold object cache, and parity compares rendered DOM,
      # not timings — but a cold run is where flaky failures come from.
      - name: Warm
        run: npm run parity

      - name: DOM parity (strict)
        run: npm run parity -- --strict

      - name: Behaviour contracts
        run: npm run behaviours

      - name: Logs on failure
        if: failure()
        run: npm run wp:logs -- --debug || true
