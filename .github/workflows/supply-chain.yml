name: Supply chain

# Dependency hygiene. Weekly as well as per-push: an advisory published after a
# merge is still an advisory, and nothing else in CI would surface it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  deps:
    name: npm and composer advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The project's own script: it asserts the production tree is clean and
      # tolerates dev-only advisories below a threshold, which is the only
      # honest bar for a repository whose dev tree includes a browser engine.
      - run: npm run audit:deps

# CodeQL is deliberately absent, not forgotten. The analysis itself runs fine on
# a runner, but uploading results needs code scanning enabled, and on a PRIVATE
# repository that requires GitHub Advanced Security — so the upload fails with
# "Code scanning is not enabled for this repository" and the job can never pass.
# A permanently red check teaches people to ignore red checks, and
# `continue-on-error` on a security job is worse than no job: it reports success
# for an upload that did not happen.
#
# It was restored for one day (2026-09-18) while the repository was public, and
# removed again when it went back to private. To bring it back: make the
# repository public or enable Advanced Security, then add a codeql job with
# `security-events: write` and the github/codeql-action init + analyze steps for
# javascript-typescript — skipping Dependabot's pull requests, whose read-only
# token cannot write security events.
#
# Note CodeQL has no PHP support, so it never covered the plugin or theme code.
# Those gates are PHPCS and PHPStan in code-quality.yml.
