name: Supply chain

# Dependency hygiene. Weekly as well as per-push: an advisory published after a
# merge is still an advisory, and nothing else in CI would surface it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  deps:
    name: npm and composer advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The project's own script: it asserts the production tree is clean and
      # tolerates dev-only advisories below a threshold, which is the only
      # honest bar for a repository whose dev tree includes a browser engine.
      - run: npm run audit:deps

# CodeQL is deliberately absent, not forgotten. The analysis itself runs fine
# on a runner, but uploading results needs code scanning enabled, and on a
# PRIVATE repository that requires GitHub Advanced Security — this repository is
# private on a free plan, so the upload fails with "Code scanning is not enabled
# for this repository" and the job can never pass. A permanently red check
# teaches people to ignore red checks, and `continue-on-error` on a security job
# is worse than no job: it reports success for an upload that did not happen.
#
# To restore it: enable code scanning (GHAS, or make the repository public),
# then add a codeql job with `security-events: write` and the
# github/codeql-action/init + analyze steps for javascript-typescript. Note
# CodeQL has no PHP support, so it would never have covered the plugin or theme
# code — the PHP gates are PHPCS and PHPStan.
