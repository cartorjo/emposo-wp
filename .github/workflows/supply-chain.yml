name: Supply chain

# Dependency hygiene. Weekly as well as per-push: an advisory published after a
# merge is still an advisory, and nothing else in CI would surface it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  deps:
    name: npm and composer advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The project's own script: it asserts the production tree is clean and
      # tolerates dev-only advisories below a threshold, which is the only
      # honest bar for a repository whose dev tree includes a browser engine.
      - run: npm run audit:deps

  # Only javascript-typescript: CodeQL has no PHP support, so it never covers
  # the plugin or theme code — those gates are PHPCS and PHPStan. This job was
  # briefly removed while the repository was private on a free plan, where the
  # analysis ran but the upload failed with "Code scanning is not enabled for
  # this repository" (private repos need Advanced Security). Public restores it.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Not on Dependabot's pull requests: its token is read-only and cannot
    # write security events, so the upload fails after a full analysis has
    # already run. Every merge to main is still scanned.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
