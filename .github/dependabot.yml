version: 2

# Grouped hard, and capped. The first version of this file grouped only
# `minor, patch` per ecosystem and left github-actions ungrouped, which opened
# seven pull requests in one minute — and because every workflow ran on each of
# them, that was seven Docker-and-Playwright runs of metered private-repo
# Actions time for four action bumps. Majors fall OUTSIDE a minor/patch group,
# so they each became their own PR too.
#
# Hence: one group per ecosystem covering every update type, and a hard cap on
# open PRs. Major bumps arriving inside a group means the PR body is the place
# where a breaking change is noticed, which is the correct place — the parity
# harness pins its reference build, so any bump can move a measurement without
# a line of this repository changing.
#
# Policy for these PRs and for alerts:
#  - A grouped bump PR merges once its checks are green (parity, audit,
#    lint, phpcs, phpstan). Green here means the measured behaviour did not
#    move, which is the only thing a dependency bump can break in this repo.
#    A red check is read in the PR body before anything is merged.
#  - Security alerts are not waited on for the weekly PR. When an advisory
#    fires on a transitive dependency we cannot bump directly — the qs pin in
#    package.json is the worked example: it reached us through
#    @wordpress/env -> @wp-playground/cli -> express, dev-only, so an
#    `overrides` entry forcing the patched line clears the alert out of band.
#    Remove such a pin once the upstream chain ships the fix on its own.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      composer:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
