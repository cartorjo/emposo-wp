version: 2

# Grouped, weekly, and deliberately narrow. The parity harness pins its
# reference build and measures against it, so an unreviewed dependency bump can
# change a measurement without changing a line of this repository's code.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      standards:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
